<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <title>GSG Tondo 2 - Pusat Kegiatan Warga</title>
    <meta name="description" content="Pusat Kegiatan Warga Huntap Tondo 2 yang dikelola modern, transparan, dan akuntabel." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GSG Tondo" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="overflow-x-hidden antialiased">
    <div id="root">
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at center, #132247 0%, #0b1329 60%, #070c1a 100%);
          color: #ffffff;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          user-select: none;
          overflow: hidden;
        }
        .splash-ambient-glow {
          position: absolute;
          width: 380px;
          height: 380px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(30, 64, 175, 0.4) 0%, rgba(37, 99, 235, 0.1) 50%, transparent 70%);
          filter: blur(40px);
          animation: splash-float 4s ease-in-out infinite alternate;
          pointer-events: none;
        }
        .splash-card {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 2rem;
          max-width: 360px;
        }
        .splash-logo-wrapper {
          position: relative;
          margin-bottom: 1.5rem;
        }
        .splash-pulse-ring {
          position: absolute;
          inset: -12px;
          border-radius: 36px;
          border: 2px solid rgba(59, 130, 246, 0.35);
          animation: splash-pulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        .splash-pulse-ring-outer {
          position: absolute;
          inset: -24px;
          border-radius: 46px;
          border: 1px solid rgba(59, 130, 246, 0.15);
          animation: splash-pulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite 0.4s;
        }
        .splash-logo-box {
          position: relative;
          width: 88px;
          height: 88px;
          border-radius: 28px;
          background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 20px 40px -10px rgba(30, 64, 175, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }
        .splash-logo-svg {
          width: 48px;
          height: 48px;
          filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }
        .splash-title {
          font-size: 1.25rem;
          font-weight: 900;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #ffffff;
          margin: 0 0 0.4rem 0;
          text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .splash-subtitle {
          font-size: 0.78rem;
          font-weight: 500;
          color: #94a3b8;
          letter-spacing: 0.03em;
          margin: 0 0 1.75rem 0;
          line-height: 1.4;
        }
        .splash-progress-track {
          width: 140px;
          height: 4px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.1);
          overflow: hidden;
          position: relative;
          margin-bottom: 1.25rem;
        }
        .splash-progress-bar {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 60%;
          border-radius: 999px;
          background: linear-gradient(90deg, #38bdf8, #2563eb, #60a5fa);
          animation: splash-shimmer 1.4s ease-in-out infinite;
        }
        .splash-badge {
          display: inline-flex;
          align-items: center;
          gap: 0.4rem;
          font-size: 0.65rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          color: #64748b;
          background: rgba(255, 255, 255, 0.04);
          padding: 0.35rem 0.8rem;
          border-radius: 999px;
          border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .splash-badge-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 8px #10b981;
        }
        @keyframes splash-pulse {
          0% { transform: scale(0.95); opacity: 0.8; }
          50% { transform: scale(1.06); opacity: 0.3; }
          100% { transform: scale(1.12); opacity: 0; }
        }
        @keyframes splash-float {
          0% { transform: translate(-50%, -50%) scale(0.9); }
          100% { transform: translate(-50%, -50%) scale(1.15); }
        }
        @keyframes splash-shimmer {
          0% { transform: translateX(-150%); }
          100% { transform: translateX(250%); }
        }
      </style>
      <div id="app-splash">
        <div class="splash-ambient-glow" style="top: 45%; left: 50%;"></div>
        <div class="splash-card">
          <div class="splash-logo-wrapper">
            <div class="splash-pulse-ring-outer"></div>
            <div class="splash-pulse-ring"></div>
            <div class="splash-logo-box">
              <svg class="splash-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
                  <path d="M96 416V144C96 130.745 106.745 120 120 120H280C293.255 120 304 130.745 304 144V416" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M304 200H392C405.255 200 416 210.745 416 224V416" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M48 416H464" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M160 200H240" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M160 280H240" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M160 360H240" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
              </svg>
            </div>
          </div>
          <h1 class="splash-title">GSG Huntap Tondo 2</h1>
          <p class="splash-subtitle">Pusat Kegiatan Warga & Reservasi Terpadu</p>
          <div class="splash-progress-track">
            <div class="splash-progress-bar"></div>
          </div>
          <div class="splash-badge">
            <span class="splash-badge-dot"></span>
            Kota Palu, Sulawesi Tengah
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
