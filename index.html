<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" 
    />
    <title>GSG Huntap Tondo 2 — Portal Reservasi & Kas Warga</title>
    <meta name="description" content="Portal reservasi jadwal, pelacakan pas sewa, dan buku kas terbuka Gedung Serbaguna Huntap Tondo 2, RT 02 Kota Palu." />
    
    <!-- Font Preconnect & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GSG Tondo 2" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="overflow-x-hidden antialiased">
    <div id="root">
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #F8F9FA;
          color: #1E293B;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          user-select: none;
          overflow: hidden;
        }
        .splash-card {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 2rem;
          max-width: 360px;
        }
        .splash-logo-box {
          width: 64px;
          height: 64px;
          border-radius: 14px;
          background-color: #1E40AF;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 1.5rem;
          border: 1px solid rgba(17, 24, 39, 0.08);
        }
        .splash-logo-svg {
          width: 36px;
          height: 36px;
        }
        .splash-title {
          font-size: 1.125rem;
          font-weight: 700;
          letter-spacing: -0.01em;
          color: #1E293B;
          margin: 0 0 0.25rem 0;
        }
        .splash-subtitle {
          font-size: 0.875rem;
          font-weight: 400;
          color: #4B5563;
          margin: 0 0 1.5rem 0;
          line-height: 1.4;
        }
        .splash-progress-track {
          width: 120px;
          height: 3px;
          border-radius: 999px;
          background: #E5E7EB;
          overflow: hidden;
          position: relative;
          margin-bottom: 1rem;
        }
        .splash-progress-bar {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 48%;
          border-radius: 999px;
          background-color: #1E40AF;
          animation: splash-shimmer 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        .splash-meta {
          font-size: 0.75rem;
          font-weight: 500;
          color: #6B7280;
        }
        @keyframes splash-shimmer {
          0% { transform: translateX(-140%); }
          100% { transform: translateX(240%); }
        }
      </style>
      <div id="app-splash">
        <div class="splash-card">
          <div class="splash-logo-box">
            <svg class="splash-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
                <path d="M96 416V144C96 130.745 106.745 120 120 120H280C293.255 120 304 130.745 304 144V416" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M304 200H392C405.255 200 416 210.745 416 224V416" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M48 416H464" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M160 200H240" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M160 280H240" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M160 360H240" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </svg>
          </div>
          <h1 class="splash-title">GSG Huntap Tondo 2</h1>
          <p class="splash-subtitle">Pusat Kegiatan Warga, Kota Palu</p>
          <div class="splash-progress-track">
            <div class="splash-progress-bar"></div>
          </div>
          <div class="splash-meta">Memuat portal warga</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
